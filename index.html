ail through that messy journey breaks and the deal gets credited elsewhere. Your programs get judged as engagement, not revenue, and the renewal gets shaky. The one thing a competitor can't fake is a provable line from your work to the closed deal, cutting straight through the messy journey. That's how you get paid for the pipeline you built. Worth a conversation?", "insight_oneliner": "You say B2B marketing has a pipeline problem and the buyer journey is a mess, which is exactly why your demand gets credited elsewhere once it hits the CRM. A provable line from your work to the close is how you get paid for pipeline. Worth a chat?", "linkedin_url": "https://uk.linkedin.com/in/stanwoods", "linkedin_conf": "high"}, {"name": "Earnest", "location": "UK", "type": "B2B Marketing Agency", "website": "https://www.earnest-agency.com", "fit_score": 4, "priority": "Deprioritise", "est_arr": "Not found", "employees": "201-500", "crm": "Unknown", "key_leader": "Chris Wilson, Co-founder & former CEO (Earnest acquired by Transmission in 2025)", "pain": "No direct pain indicators found for their internal sales operations. As a marketing agency, their clients may experience pipeline issues, but this is not a direct pain for Earnest's own sales.", "angle": "Earnest, as a B2B marketing agency, could benefit from white-labeling or reselling RevIntel to their B2B clients who need revenue intelligence and pipeline optimization.", "contact_title": "Co-founder & former CEO (Earnest acquired by Transmission in 2025)", "radar_score": 100, "triggers": ["Hiring now", "AI/data initiative", "Pipeline/conversion pain", "Partner/reseller fit"], "verification": "Live verified", "verif_conf": 100, "salesfinity": "not dialed", "aimfox": "not messaged", "touched": false, "insight_operate": "You build brand and demand campaigns for B2B clients, creating the awareness and interest that turns into pipeline downstream.", "insight_whynow": "Your work sits at the top of the funnel, building the brand and demand that later becomes pipeline. That is the hardest place to get credit. The opportunities your campaigns create show up weeks later inside the client's sales team, and by then they get logged as inbound, word of mouth, or the rep's own hustle. The further your influence is from the close, the easier it is to quietly write it off when budgets are reviewed. Trust in what you actually drove is the one thing a competitor can't replicate. Making every opportunity provably trace back to your work is how you get paid for the demand you created and keep the account. Worth a conversation?", "insight_oneliner": "Your campaigns create demand that closes weeks later inside the client's sales team, where it gets logged as inbound. Proving those opportunities trace back to you is how you get paid for the demand you actually drove. Open to chatting?"}, {"name": "Impression", "location": "UK", "type": "B2B Marketing Agency", "website": "https://www.impression.co.uk", "fit_score": 6, "priority": "Tier 3 - This Quarter", "est_arr": "£10M-£20M", "employees": "100-300", "crm": "Unknown (partners with HubSpot, Bloomreach, Klaviyo)", "key_leader": "Mikey Emery, Co-owner & Chief Commercial Officer", "pain": "No specific pain indicators found", "angle": "Position RevIntel as a white-label solution to enhance their B2B clients' revenue intelligence and sales pipeline management.", "contact_title": "Co-owner & Chief Commercial Officer", "radar_score": 100, "triggers": ["Hiring now", "CRM/RevOps motion", "AI/data initiative", "Pipeline/conversion pain", "Partner/reseller fit"], "verification": "Live verified", "verif_conf": 100, "salesfinity": "not dialed", "aimfox": "not messaged", "touched": false, "insight_operate": "You run performance marketing across SEO, paid media and CRO, generating measurable revenue and opportunities for clients through proprietary tooling.", "insight_whynow": "You sell on performance and you back it with numbers, but the opportunities your campaigns create stil   if(a.linkedin_url) return a.linkedin_url;
  const q = encodeURIComponent((a.key_leader? a.key_leader.split(',')[0]+' ':'') + a.name);
  return 'https://www.linkedin.com/search/results/people/?keywords='+q;
}
function list(){
  return AGENCIES.filter(a=>{
    if(filter==='t1') return (a.priority||'').toLowerCase().includes('act now');
    if(filter==='todo') return !done[a.name];
    return true;
  });
}
function render(){
  const items = list();
  const main = document.getElementById('main');
  const totalDone = AGENCIES.filter(a=>done[a.name]).length;
  document.getElementById('count').textContent = totalDone+' / '+AGENCIES.length+' done';
  document.getElementById('prog').style.width = (100*totalDone/AGENCIES.length)+'%';
  if(items.length===0){ main.innerHTML='<div class="empty">Nothing here — try another filter.</div>'; return; }
  if(idx>=items.length) idx=items.length-1;
  if(idx<0) idx=0;
  const a = items[idx];
  const verified = (a.verification||'').toLowerCase().includes('live verified');
  const t1 = (a.priority||'').toLowerCase().includes('act now');
  const rank = AGENCIES.indexOf(a)+1;
  const msg = msgs[a.name] != null ? msgs[a.name] : defaultMsg(a);
  main.innerHTML = `
    <div class="card">
      <div class="rank">#${rank} of ${AGENCIES.length}  ·  ${idx+1}/${items.length} in view</div>
      <div class="name">${a.name}</div>
      <div class="sub">${a.type||''}${a.location? ' · '+a.location:''}</div>
      <div class="chips">
        ${verified?'<span class="chip v">✓ Verified</span>':''}
        ${t1?'<span class="chip t1">ACT NOW</span>':''}
        ${a.radar_score!=null?'<span class="chip">radar '+a.radar_score+'</span>':''}
        ${a.fit_score?'<span class="chip">fit '+a.fit_score+'/10</span>':''}
        ${a.est_arr?'<span class="chip">'+a.est_arr+'</span>':''}
      </div>
      <div class="lead">👤 ${a.key_leader||'Contact TBD'}</div>
      ${a.contact_title?'<div class="leadtitle">'+a.contact_title+'</div>':''}
      ${a.insight_whynow?'<div class="lbl">Why now</div><div class="body">'+a.insight_whynow+'</div>':(a.pain?'<div class="lbl">Why now</div><div class="body">'+a.pain+'</div>':'')}
      <div class="lbl">Your message</div>
      <textarea id="msg">${msg.replace(/</g,'&lt;')}</textarea>
      <div class="cc" id="cc"></div>
      <div class="actions">
        <a class="li" id="copyopen" href="${linkedinURL(a)}" target="_blank" rel="noopener" style="text-decoration:none;">Copy + Open LinkedIn ↗</a>
      </div>
      ${a.linkedin_url?'':'<div class="nodirect">No direct profile yet — opens a search</div>'}
    </div>`;
  const ta = document.getElementById('msg');
  const cc = document.getElementById('cc');
  function upd(){ const n=ta.value.length; cc.textContent=n+' chars'+(n>300?' · over LinkedIn connect-note limit (300)':''); cc.className='cc'+(n>300?' over':''); }
  ta.addEventListener('input', ()=>{ msgs[a.name]=ta.value; localStorage.setItem(MSG_KEY,JSON.stringify(msgs)); upd(); });
  upd();
  // Auto-copy so the message is ready to paste the moment LinkedIn opens.
  navigator.clipboard && navigator.clipboard.writeText(ta.value).catch(()=>{});
  document.getElementById('copyopen').addEventListener('click', (e)=>{
    // The <a> opens LinkedIn natively (never pop-up-blocked). We just copy the message alongside.
    try{ navigator.clipboard.writeText(ta.value); }catch(_){ ta.select(); document.execCommand('copy'); }
    const b=document.getElementById('copyopen'); b.textContent='Copied ✓ — paste in LinkedIn'; b.classList.add('ok');
    setTimeout(()=>{b.textContent='Copy + Open LinkedIn ↗'; b.classList.remove('ok');},1800);
  });
  const db = document.getElementById('done');
  if(done[a.name]){ db.textContent='Done ✓ — Next ›'; db.classList.add('is'); } else { db.textContent='Sent ✓ → Next'; db.classList.remove('is'); }
}
document.querySelectorAll('.filters button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); filter=b.dataset.f; idx=0; render();
}));
document.getElementById('prev').addEventListener('click',()=>{ idx--; render(); window.scrollTo(0,0); });
document.getElementById('next').addEventListener('click',()=>{ idx++; render(); window.scrollTo(0,0); });
document.getElementById('done').addEventListener('click',()=>{
  const a=list()[idx]; if(!a) return;
  // Mark sent/done and advance to the next card in one tap.
  done[a.name]=true;
  localStorage.setItem(DONE_KEY,JSON.stringify(done));
  if(filter!=='todo') idx++;   // in "Not done" view the list shrinks, so stay on index
  render(); window.scrollTo(0,0);
});
render();
</script>
</body>
</html>
