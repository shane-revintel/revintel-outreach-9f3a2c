 :root{--ink:#11242E;--body:#3F4A52;--teal:#58BDCD;--mist:#F5F7F9;--card:#fff;--line:#E3EAEE;--muted:#7A8A93;--green:#2FA36B;--red:#D2544E;--amber:#C08A24;}
 *{box-sizing:border-box;} body{margin:0;background:var(--mist);color:var(--body);font-family:'Hanken Grotesk',system-ui,sans-serif;}
 header{position:sticky;top:0;z-index:5;background:rgba(245,247,249,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 16px;}
 .htop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
 .brand{font-weight:800;color:var(--ink);letter-spacing:.4px;} .brand span{color:var(--teal);}

 input#q{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:14px;background:#fff;color:var(--ink);}

 main{padding:14px 16px 60px;max-width:1200px;margin:0 auto;}

 th{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600;background:#fbfcfd;}
 td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle;}
 tr:last-child td{border-bottom:none;}
 tr.done{opacity:.5;}
 .co{font-weight:700;color:var(--ink);} .sub{font-size:12px;color:var(--muted);}
 .who{color:var(--ink);font-weight:600;} .whot{font-size:12px;color:var(--muted);}

 .b-act{background:#fbe9e8;color:var(--red);} .b-2{background:#eef8fa;color:#2f889a;} .b-3{background:#f1f4f6;color:var(--muted);} .b-dep{background:#f6efe4;color:var(--amber);}

fied": true, "arr": "Not found (likely >£20M given employee count and funding)", "msg": "You run SDRs across dozens of client CRMs you don't control, and once an opportunity lands there, proving it was Operatix gets murky and the client's team claims the win. A provable origin trail is how you get paid at renewal. Worth a chat?", "website": "https://operatix.net"}, {"name": "Pearl Lemon Leads", "type": "Appointment Setting", "location": "London/NY", "leader": "Deepak Shukla", "title": "CEO & Founder", "linkedin": "https://uk.linkedin.com/in/deepakseoexpert", "tier": "Tier 2 - This Week", "verified": true, "arr": "£2.8M", "msg": "Deepak, you push meetings into the client's world across every channel, but the trail goes cold and they credit their own inbound at renewal. A provable link back to Pearl Lemon is what they can't argue with. Worth a quick chat?", "website": "https://pearllemonleads.com"}, {"name": "Flowd", "type": "Appointment Setting", "location": "UK (Manchester)", "leader": "Mitch Clayton", "title": "Founder & CEO", "linkedin": "https://uk.linkedin.com/in/mitch-clayton-6bb227aa", "tier": "Tier 2 - This Week", "verified": true, "arr": "£3M", "msg": "You sell clients on clean pipeline, so you know how fast a deal's origin gets lost once it's in their CRM. A provable trail showing the opportunity was Flowd's is how renewal stays a no-brainer instead of a defence. Worth a conversation?", "website": "https://flowd.co.uk"}, {"name": "The Lead Generation Company", "type": "Lead Generation", "location": "UK", "leader": "Steven Smith", "title": "Founder & Managing Director", "linkedin": "https://uk.linkedin.com/in/stevenalexandersmith", "tier": "Tier 2 - This Week", "verified": true, "arr": "Not found", "msg": "Steven, you hand warm phone conversations to clients' reps, but once they're in the pipeline the thread back to you frays and later wins get chalked up to their team. A provable origin trail keeps you paid at renewal. Worth a chat?", "website": "https://theleadgenerationcompany.co.uk"}, {"name": "We Are Team Rocket", "type": "Lead Generation", "location": "UK/Global", "leader": "Guy Klajman", "title": "Client Acquisition Director", "linkedin": "https://www.linkedin.com/in/guyklajman/", "tier": "Tier 2 - This Week", "verified": true, "arr": "£3M-£5M", "msg": "Guy, across 300+ clients every opportunity vanishes into a different CRM and clients credit their own teams for what you started. At your scale a provable link from your work to the close is how you stop the renewal doubt. Open to talking it through?", "website": "https://www.weareteamrocket.co.uk"}, {"name": "The Telemarketing Company", "type": "Sales Outsourcing", "location": "UK", "leader": "Niall Habba", "title": "Managing Director & Founder", "linkedin": "", "tier": "Tier 3 - This Quarter", "verified": true, "arr": "£10M", "msg": "Your proof lives on the phone and fades the second a conversation hits the client's pipeline, so later wins rarely trace back to your call. A provable trail showing the opportunity was yours is how you stay paid. Worth a conversation?", "website": "https://www.ttmc.co.uk"}, {"name": "SalesAR", "type": "Sales Outsourcing", "location": "UK/Global", "leader": "Irina Lebedjuk", "title": "Chief Sales Officer", "linkedin": "https://www.linkedin.com/in/irina-lebedjuk-b60344b6/", "tier": "Tier 2 - This Week", "verified": true, "arr": "<$5M", "msg": "Irina, SalesAR turns cold outreach into meetings, but after handoff it's the client who decides if they were qualified, and your wins stop tracing back to you. A provable trail of what you created is how you stay paid. Worth a chat?", "website": "https://salesar.io"}, {"name": "Ledger Bennett", "type": "B2B Marketing Agency", "location": "UK", "leader": "Andrea Glenn", "title": "CEO", "linkedin": "https://uk.linkedin.com/in/andrea-glenn", "tier": "Tier 2 - This Week", "verified": true, "arr": "£5M-£10M", "msg": "You build around the client's revenue team and already worry about CRM data integrity, so you know how fast your work gets lost in their pipeline. A provable trail from your demand to the closed deal is how you stay paid. Open to talking it through?", "website": "https://ledgerbennett.com"}, {"name": "Transmission", "type": "B2B Marketing Agency", "location": "UK/Global", "leader": "Max Massengill", "title": "VP, GTM Strategy", "linkedin": "https://www.linkedin.com/in/max-massengill-6a0b6b39/", "tier": "Tier 2 - This Week", "verified": true, "arr": "£75.5M-£122.5M", "msg": "Max, at your scale the pipeline you generate flows into systems you don't own and your campaigns get reframed as branding, not revenue. A provable trail from demand to closed deal keeps you paid as a pipeline driver. Worth a conversation?", "website": "https://www.transmissionagency.com"}, {"name": "Velocity Partners", "type": "B2B Marketing Agency", "location": "London/NY", "leader": "Stan Woods", "title": "CEO & Co-founder", "linkedin": "https://uk.linkedin.com/in/stanwoods", "tier": "Tier 2 - This Week", "verified": true, "arr": "£15.5M (based on $19.4M revenue)", "msg": "You say B2B marketing has a pipeline problem and the buyer journey is a mess, which is exactly why your demand gets credited elsewhere once it hits the CRM. A provable line from your work to the close is how you get paid for pipeline. Worth a chat?", "website": "https://www.velocitypartners.com"}, {"name": "Earnest", "type": "B2B Marketing Agency", "location": "UK", "leader": "Chris Wilson", "title": "Co-founder & former CEO (Earnest acquired by Transmission in 2025)", "linkedin": "", "tier": "Deprioritise", "verified": true, "arr": "Not found", "msg": "Your campaigns create demand that closes weeks later inside the client's sales team, where it gets logged as inbound. Proving those opportunities trace back to you is how you get paid for the demand you actually drove. Open to chatting?", "website": "https://www.earnest-agency.com"}, {"name": "Impression", "type": "B2B Marketing Agency", "location": "UK", "leader": "Mikey Emery", "title": "Co-owner & Chief Commercial Officer", "linkedin": "https://uk.linkedin.com/in/mikeyemery", "tier": "Tier 3 - This Quarter", "verified": true, "arr": "£10M-£20M", "msg": "You sell on performance, but once opportunities hit the client's CRM the attribution gets fought over and your numbers soften at renewal. Proving every one traces back to you turns the pitch into proof. Worth a quick chat?", "website": "https://www.impression.co.uk"}, {"name": "Gripped", "type": "Lead Generation", "location": "London", "leader": "Steve Eveleigh", "title": "Co-Founder (CMO)", "linkedin": "https://uk.linkedin.com/in/gripped", "tier": "Tier 2 - This Week", "verified": true, "arr": "£3M-£5M", "msg": "You promise pipeline that tracks to revenue, but once opportunities hit the client's CRM your SQLs get re-tagged as deals they'd have got anyway. On rolling contracts, proving the link back to you is what saves the retainer. Open to chatting?", "website": "https://gripped.io"}, {"name": "NoGood", "type": "Growth Marketing", "location": "US/UK", "leader": "Queenie Leung", "title": "VP, Growth & Senior Strategist", "linkedin": "https://www.linkedin.com/in/queeniekleung/", "tier": "Tier 2 - This Week", "verified": true, "arr": "£5M-£10M", "msg": "Your growth work creates opportunities scattered across the client's CRM, ad tools and sales notes, so the credit fragments and they start doubting how much was you. Proving every one traces back to you is how you keep the account. Worth a chat?", "website": "https://nogood.io"}, {"name": "Directive Consulting", "type": "GTM Agency", "location": "US/UK", "leader": "Drew Choco", "title": "Sr. Director of Sales / VP of Growth", "linkedin": "https://www.linkedin.com/in/andrewchoco/", "tier": "Tier 2 - This Week", "verified": true, "arr": "£36M-£46M", "msg": "You build the client's RevOps, so the opportunities you generate just look like their pipeline in their CRM. The better you wire it up, the more your contribution disappears. Proving the link back to you is how you grow the fee, not defend it. Worth a chat?", "website": "https://directiveconsulting.com"}, {"name": "Refine Labs", "type": "Demand Generation", "location": "US", "leader": "Karlie Morien", "title": "Director of Sales", "linkedin": "https://www.linkedin.com/in/karliemorien/", "tier": "Tier 2 - This Week", "verified": true, "arr": "£15M-£25M", "msg": "Your demand work closes weeks later as inbound in the client's CRM, so the growth you drove looks self-sourced, right when they're scrutinising CAC. Proving those opportunities trace back to you is how you keep the budget. Open to chatting?", "website": "https://refinelabs.com"}, {"name": "Gravitai", "type": "Lead Generation", "location": "UK", "leader": "William McMahon", "title": "CEO & Founder", "linkedin": "https://uk.linkedin.com/in/williammcmahon", "tier": "Deprioritise", "verified": true, "arr": "£1M-£5M", "msg": "You outgrew fragmented spreadsheets, so you know how easily a record gets lost. The leads you hand clients scatter into their tools and get credited as their pipeline. Proving every one traces back to you is how you stay paid. Worth a chat?", "website": "https://gravitai.com"}, {"name": "GLO", "type": "Lead Generation", "location": "UK", "leader": "John Parnell", "title": "Founder/Lead (unconfirmed)", "linkedin": "", "tier": "Tier 2 - This Week", "verified": true, "arr": "Not found", "msg": "You connect ad spend to revenue, but the closed deal lives in the client's hands, so your spend-to-revenue story has a missing last link. Proving the lead traces from your spend to their close is how you hold the ROI claim. Open to chatting?", "website": "https://www.generateleadsonline.co.uk"}, {"name": "Mower Agency", "type": "B2B Marketing Agency", "location": "US", "leader": "Pete Wiezalis", "title": "Vice President, Growth Strategy", "linkedin": "https://www.linkedin.com/in/petewiezalis/", "tier": "Tier 3 - This Quarter", "verified": true, "arr": "Not found (likely >£20M)", "msg": "You deliver big lead numbers, but volume handed to a client gets discounted once their reps close the deals and take the credit. Proving each lead traces through to what it became is how you get paid for results at renewal. Worth a chat?", "website": "https://www.mower.com"}, {"name": "Cleverly", "type": "LinkedIn Agency", "location": "US", "leader": "Matthew Johnson", "title": "Head of Sales", "linkedin": "https://www.linkedin.com/in/matthewjohns0n/", "tier": "Tier 2 - This Week", "verified": true, "arr": "£5M (based on CEO's LinkedIn post)", "msg": "You set meetings at scale, so the real test is whether the client believes the ones you handed over were qualified. They quietly write off the doubtful ones and you eat it. Proving each meeting was real and yours keeps you paid. Open to chatting?", "website": "https://www.cleverly.co"}, {"name": "InvisiblePPC", "type": "Lead Generation", "location": "UK/US", "leader": "Avi Kumar", "title": "Owner & CEO (also CEO of Kuware)", "linkedin": "https://www.linkedin.com/in/avikumar", "tier": "Tier 3 - This Quarter", "verified": true, "arr": "$3M", "msg": "You're white-label by design, so the leads you create get handed on under a partner's brand and your name disappears. When they wonder if they need you, you've no proof of the pipeline you drove. Proving the link keeps partners renewing. Worth a chat?", "website": "https://invisibleppc.com"}, {"name": "Digital Litmus", "type": "RevOps Agency", "location": "UK", "leader": "Seb Hardman", "title": "Founder & Managing Director", "linkedin": "https://uk.linkedin.com/in/sebhardman", "tier": "Tier 2 - This Week", "verified": true, "arr": "Not found", "msg": "You build the client's HubSpot revenue engine, so the opportunities you create just read as their pipeline in their own dashboard. The better you wire it, the more your work dissolves into it. Proving the link is how you grow the fee. Worth a chat?", "website": "https://www.digitallitmus.com"}, {"name": "Six & Flow", "type": "RevOps Agency", "location": "UK", "leader": "Richard Wood", "title": "Founder & CEO", "linkedin": "https://www.linkedin.com/in/richardtempestwood", "tier": "Tier 1 - Act Now", "verified": true, "arr": "£1M-£10M", "msg": "You spend your days connecting client revenue systems, but your own work then vanishes into that same pipeline and starts looking like their result, not yours. Proving the opportunities trace back to you is how you keep getting paid at renewal. Worth a quick chat?", "website": "https://www.sixandflow.com"}, {"name": "Think RevOps", "type": "RevOps Agency", "location": "UK", "leader": "Catherine Mandungu", "title": "Founder & CEO", "linkedin": "https://www.linkedin.com/in/catherine-mandungu-71679526", "tier": "Tier 1 - Act Now", "verified": true, "arr": "Not found", "msg": "You sell trusted data, so you know what happens when a number can't be traced. The opportunities you create land in the client's CRM and the credit blurs. Proving they trace back to you is how you defend the fee at renewal. Open to talking it through?", "website": "https://www.thinkrevops.com"}, {"name": "Revenue Wizards", "type": "RevOps Agency", "location": "UK", "leader": "Haris Odobasic", "title": "Co-Founder & Revenue Strategy Partner", "linkedin": "https://www.linkedin.com/in/harisodobasic", "tier": "Tier 1 - Act Now", "verified": true, "arr": "Not found", "msg": "The better you make a client's reporting, the more the wins look like theirs and the harder your renewal gets. The opportunities you surfaced fade into their pipeline. Proving they trace back to you is how you stay paid for it. Worth a chat?", "website": "https://revenuewizards.com"}, {"name": "RevOps Automated", "type": "RevOps Agency", "location": "UK", "leader": "Natalie Furness", "title": "Founder & CEO", "linkedin": "https://www.linkedin.com/in/nataliefurness/", "tier": "Tier 2 - This Week", "verified": true, "arr": "Not found (likely below RevIntel's direct customer ICP, as they are a service agency with 2-10 employees)", "msg": "When you automate revenue ops well, it goes invisible, and so does your credit. The opportunities your work creates start looking like the system just running itself. Proving they trace back to you is how you keep getting paid. Open to a chat?", "website": "https://revopsautomated.com"}, {"name": "Carabiner Group", "type": "RevOps Agency", "location": "US", "leader": "Seamus Ruiz-Earle", "title": "CEO & Founder", "linkedin": "https://www.linkedin.com/in/seamusruizearle/", "tier": "Tier 2 - This Week", "verified": true, "arr": "Not found", "msg": "You rebuild clients' Salesforce and HubSpot so they finally trust the numbers, but a clean system makes people forget who fixed it. The opportunities flowing through it look like their pipeline. Proving they trace back to you is how you stay paid. Worth a chat?", "website": "https://carabinergroup.com"}, {"name": "Strativera", "type": "RevOps Agency", "location": "US", "leader": "Janae Tanner", "title": "Co-founder & VP, Growth & Client Success", "linkedin": "https://www.linkedin.com/in/janae-m-tanner", "tier": "Tier 1 - Act Now", "verified": true, "arr": "Not found", "msg": "Your edge is that you stay and execute, not just hand over a deck. But the pipeline you build lives in the client's CRM and your work blurs into their inbound. Proving the opportunities trace back to you is how you get paid for the execution. Open to a chat?", "website": "https://strativera.com"}, {"name": "Winning by Design", "type": "RevOps Agency", "location": "US/Global", "leader": "Lauren Goldstein", "title": "Chief Revenue Officer", "linkedin": "https://www.linkedin.com/in/laurengoldstein", "tier": "Tier 1 - Act Now", "verified": true, "arr": "£33.3M (2023) - £52.5M (2024)", "msg": "You reshape how a client's whole revenue team sells, so the wins get credited to their team, not your model. The opportunities it produces blur into their results. Proving they trace back to you is how you stay paid at renewal. l is one dedicated SDR per client, so your value is the meetings that rep books. But once they flow into the client's pipeline the work blurs into their numbers. Proving each meeting traced back to your rep is the difference at renewal. Open to a chat?", "website": "https://fiveringsmarketing.com"}, {"name": "Appointment Setter Online", "type": "Appointment Setting", "location": "London/NY", "leader": "", "title": "", "linkedin": "", "tier": "Unranked", "verified": true, "arr": "", "msg": "You sell on no contracts and free trials, so you re-prove your worth constantly and the meetings are the proof. But omnichannel work collapses into one line on the client's side, and no contract means no cushion when doubt creeps in. A provable trail keeps you paid. Worth a chat?", "website": "https://appointmentsetteronline.com"}, {"name": "GrowLeady", "type": "Lead Generation", "location": "UK", "leader": "Steven Haggerty", "title": "Founder", "linkedin": "https://www.linkedin.com/in/stevenhaggerty", "tier": "Unranked", "verified": true, "arr": "", "msg": "Your clients spend five figures a month and watch it closely, so every meeting is under a microscope. But the engine that booked it vanishes once the opp hits their CRM and they ask what they're paying for. Proving each opp traced back to you defends the fee. Open to a chat?", "website": "https://growleady.io"}, {"name": "FullFunnel", "type": "Sales Outsourcing", "location": "US/Global", "leader": "Andrei Zinkevich", "title": "Co-Founder", "linkedin": "https://www.linkedin.com/in/azinkevich/", "tier": "Unranked", "verified": true, "arr": "", "msg": "You don't run outbound, you build the client's ABM engine and hand it over. So the pipeline shows up as their wins, and over months your design fades from view. Proving the pipeline traces back to the system you built is how you keep getting re-hired. Worth a chat?", "website": "https://fullfunnel.io"}, {"name": "LevelUp Leads", "type": "SDR Outsourcing", "location": "US", "leader": "John Karsant", "title": "Founder & CEO", "linkedin": "https://www.linkedin.com/in/johnkarsant", "tier": "Unranked", "verified": true, "arr": "", "msg": "Clients hire you so they don't build an SDR team, so your value is invisible by design, it's the meetings, not headcount. But once they hit the pipeline your reps' work disappears. Proving each meeting traced back to your team is how you hold the account. Worth a chat?", "website": "https://www.levelupleads.com"}, {"name": "Purple Sales", "type": "Sales Outsourcing", "location": "US/Canada/EU", "leader": "Sam Balzan", "title": "Founder & CEO", "linkedin": "https://ca.linkedin.com/in/sambalzan", "tier": "Unranked", "verified": false, "arr": "", "msg": "You run both outbound and inbound for the same client, so attribution is brutal, was the opp your SDR, your inbound, or their brand? In their HubSpot it all blurs. Proving which opps were yours is how you defend a five-figure renewal. Open to a chat?", "website": "https://www.purplesales.io"}, {"name": "CloudTask", "type": "SDR Outsourcing", "location": "US/UK", "leader": "Amir Reiter", "title": "Founder & CEO", "linkedin": "https://www.linkedin.com/in/amirreiter/", "tier": "Unranked", "verified": false, "arr": "", "msg": "You sit in the middle vouching for the teams on your marketplace, so your model rests on proof. When a matched team books meetings, can you show the opp came through you, or does credit drift to the talent and cut you out next time? Proving the trail keeps you paid. Worth a chat?", "website": "https://www.cloudtask.com"}, {"name": "Concept (Koncept)", "type": "Appointment Setting", "location": "UK", "leader": "", "title": "", "linkedin": "", "tier": "Unranked", "verified": false, "arr": "", "msg": "You open doors in long-cycle industrial sales where a meeting today becomes a deal in a year. By the time it lands, the appointment your rep set is forgotten and the client credits their own team. Proving the door-opening traced back to you is how you renew. Open to a chat?", "website": "https://www.conceptsales.co.uk"}, {"name": "VSL (Virtual Sales Ltd)", "type": "Sales Outsourcing", "location": "UK", "leader": "Andrew (Andy) Dickens", "title": "Founder & CEO", "linkedin": "https://uk.linkedin.com/in/andydickens-ittelemarketing", "tier": "Unranked", "verified": false, "arr": "", "msg": "You sell monthly with no tie-ins, so clients can walk anytime and the only thing keeping them is visible value, the meetings your callers set. But once handed over, the call that earned them vanishes. A provable trail back to your work is what stops monthly churn. Worth a chat?", "website": "https://www.virtualsalesltd.com"}, {"name": "Outbound Sales UK", "type": "Appointment Setting", "location": "UK", "leader": "", "title": "", "linkedin": "", "tier": "Unranked", "verified": false, "arr": "", "msg": "Your job is the calls the client's own team won't make, so your whole value is the booked meeting, nothing else is visible. But once it moves to their salesperson the outreach that created it disappears. A provable trail that you set it is how you keep the contract. Open to a chat?", "website": "https://www.outboundsalesuk.co.uk"}];
const KEY='revintel_outreach_done';
let done = JSON.parse(localStorage.getItem(KEY)||'{}');
let filter='all', q='';
function tierBadge(t){ const l=t.toLowerCase();
  if(l.includes('act now'))return '<span class="badge b-act">Act Now</span>';
  if(l.includes('this week'))return '<span class="badge b-2">This Week</span>';
  if(l.includes('quarter'))return '<span class="badge b-3">This Qtr</span>';
  if(l.includes('deprior'))return '<span class="badge b-dep">Nurture</span>';
  return '<span class="badge b-3">'+t+'</span>'; }
function list(){ return LEADS.filter(a=>{
  if(filter==='act' && !a.tier.toLowerCase().includes('act now')) return false;
  if(filter==='todo' && done[a.name]) return false;
  if(q){ const s=(a.name+' '+a.leader+' '+a.type).toLowerCase(); if(!s.includes(q)) return false; }
  return true; }); }
function render(){
  const items=list();
  const dn=LEADS.filter(a=>done[a.name]).length;
  document.getElementById('count').innerHTML=`${LEADS.length} leads · <b>${dn} contacted</b> · ${LEADS.length-dn} to go`;
  document.getElementById('rows').innerHTML=items.map((a,i)=>`
    <tr class="${done[a.name]?'done':''}" data-n="${encodeURIComponent(a.name)}">
      <td><input type="checkbox" ${done[a.name]?'checked':''} onchange="toggle('${a.name.replace(/'/g,"\\'")}')"></td>
      <td><div class="co">${a.name}</div><div class="sub">${a.type}${a.location?' · '+a.location:''}</div></td>
      <td><div class="who">${a.leader||'—'}</div><div class="whot">${a.title||''}</div></td>
      <td class="hide">${tierBadge(a.tier)}</td>
      <td class="hide">${a.verified?'<span class="v">✓ Verified</span>':'<span class="nv">—</span>'}</td>
      <td>${a.linkedin?`<a class="li" href="${a.linkedin}" target="_blank" rel="noopener">Open ↗</a>`:'<span class="li none">search</span>'}</td>
      <td>${a.msg?`<button class="cp" onclick="copyMsg(this,'${encodeURIComponent(a.msg)}')">Copy</button>`:''}</td>
    </tr>`).join('');
}
window.toggle=function(n){ if(done[n])delete done[n]; else done[n]=true; localStorage.setItem(KEY,JSON.stringify(done)); render(); };
window.copyMsg=function(btn,enc){ const t=decodeURIComponent(enc);
  try{navigator.clipboard.writeText(t);}catch(e){}
  btn.textContent='Copied ✓'; btn.classList.add('ok'); setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('ok');},1400); };
document.getElementById('q').addEventListener('input',e=>{q=e.target.value.toLowerCase();render();});
document.querySelectorAll('.filters button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); filter=b.dataset.f; render(); }));
render();
</script>
</body></html>
